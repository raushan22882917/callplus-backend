[project]
name = "call-center-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=4.0.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.0",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "razorpay>=2.0.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.0",
    "twilio>=9.11.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = [".", "apps/api"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends(...)/Query(...) in defaults is the idiomatic pattern
    "UP042", # str+Enum (not StrEnum) so JSON responses serialize as plain strings
]

[tool.ruff.lint.per-file-ignores]
# Env vars must be forced before importing app.main (which reads settings at
# import time), so imports can't all be at the top of the file.
"tests/conftest.py" = ["E402"]
