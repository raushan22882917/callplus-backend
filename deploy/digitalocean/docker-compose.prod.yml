# Production stack for one DigitalOcean droplet. Run from this folder:
#   docker compose --env-file .env -f docker-compose.prod.yml up -d --build
# Only Caddy (80/443) is reachable from the internet. Postgres and Redis live on the internal
# network and have no published ports.

x-app-env: &app-env
  env_file: .env
  environment: &app-environment
    ENV: production
    DEBUG: "false"
    DATABASE_URL: postgresql+asyncpg://callcenter:${POSTGRES_PASSWORD}@postgres:5432/callcenter
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    PUBLIC_BASE_URL: https://${API_DOMAIN}
    FRONTEND_BASE_URL: ${FRONTEND_URL}  # where people open the dashboard (links in emails, privacy page)
    # Every website allowed to call this API from a browser, as a JSON list: the dashboard wherever
    # it is hosted (the Railway one, this server's, or both).
    CORS_ALLOW_ORIGINS: ${CORS_ORIGINS_JSON}
    REALTIME_WS_URL: wss://${REALTIME_DOMAIN}/ws/twilio
    TRUST_X_FORWARDED_FOR: "true"  # the real client address, from Caddy, for rate limits

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: callcenter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: callcenter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100", "-c", "log_min_duration_statement=1000"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callcenter -d callcenter"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 384m
    networks: [internal]

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    <<: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=4).status == 200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    networks: [internal]

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    # Same image; passing a command skips migrations (the api container runs them).
    command: ["uv", "run", "--no-sync", "celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    <<: *app-env
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 1g
    networks: [internal]

  beat:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    # The scheduler: retention purge, wallet settling, knowledge re-sync, SLA checks, call reaper.
    # Exactly one of these may run, or every job would run twice.
    command: ["uv", "run", "--no-sync", "celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info", "-s", "/tmp/celerybeat-schedule"]
    <<: *app-env
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 256m
    networks: [internal]

  realtime:
    build:
      context: ../..
      dockerfile: infrastructure/docker/realtime.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_BASE_URL: http://api:8000/api/v1/internal
      PORT: "9000"
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 512m
    networks: [internal]

  frontend:
    # Optional: only started with `--profile frontend`. Leave it off when the dashboard is hosted
    # elsewhere (for example Railway) and only the backend lives on this server.
    profiles: ["frontend"]
    build:
      context: ${FRONTEND_DIR:-../../../frontend}
      dockerfile: Dockerfile.prod  # copied in from frontend.Dockerfile by deploy.sh
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN}/api/v1
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
    restart: unless-stopped
    mem_limit: 768m
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      REALTIME_DOMAIN: ${REALTIME_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_started}
      realtime: {condition: service_started}
      frontend: {condition: service_started, required: false}  # absent on a backend-only server
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
